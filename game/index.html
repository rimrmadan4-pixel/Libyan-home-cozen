<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2E7D4F"><link rel="icon" href="icon-192.png"></head><body>
<title>تحدّي المطبخ الليبي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one centered column. Questions that show ingredients list them as pills straight under the title,
   the answers follow, and a thin red-black-green line closes the page. A white plate appears only where it shows a dish. */
:root{
  color-scheme:light;
  --bg:#F6ECD7; --glow:#FFF8E9; --plate:#FFFDF8; --ring:rgba(255,255,255,.6); --pill:#FFFFFF;
  --ink:#3A2A1D; --ink2:#75604A; --line:rgba(58,42,29,.16);
  --green:#1F5C42; --on-green:#FFF8EA; --copper:#A4502A; --on-copper:#FFF8EA; --honey:#E2A53A; --on-honey:#2B1D0E;
  --good:#2B7A4E; --good-bg:#DFEFE3; --bad:#B03E2E; --bad-bg:#F7DFD8;
  --shadow:0 14px 28px -14px rgba(58,42,29,.45);
  --fl-r:#C23B2E; --fl-k:#1E1B18; --fl-g:#2E7D4F;
  --f-display:'Aref Ruqaa','Amiri','Noto Naskh Arabic',serif;
  --f-body:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#19140F; --glow:#2A2017; --plate:#2E251B; --ring:rgba(255,255,255,.07); --pill:#382D21;
    --ink:#F5E9D3; --ink2:#C2B096; --line:rgba(245,233,211,.2);
    --green:#47A47A; --on-green:#0E2218; --copper:#E38E5F; --on-copper:#2A1508; --honey:#E9B44C; --on-honey:#2B1D0E;
    --good:#63C18F; --good-bg:#1F3B2C; --bad:#EB8470; --bad-bg:#45261F;
    --shadow:0 14px 28px -14px rgba(0,0,0,.7);
    --fl-k:#6E6152;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#19140F; --glow:#2A2017; --plate:#2E251B; --ring:rgba(255,255,255,.07); --pill:#382D21;
  --ink:#F5E9D3; --ink2:#C2B096; --line:rgba(245,233,211,.2);
  --green:#47A47A; --on-green:#0E2218; --copper:#E38E5F; --on-copper:#2A1508; --honey:#E9B44C; --on-honey:#2B1D0E;
  --good:#63C18F; --good-bg:#1F3B2C; --bad:#EB8470; --bad-bg:#45261F;
  --shadow:0 14px 28px -14px rgba(0,0,0,.7);
  --fl-k:#6E6152;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  background-image:radial-gradient(120% 55% at 50% 0%,var(--glow),transparent 70%);
  background-repeat:no-repeat;
  font-family:var(--f-body); font-size:17px; line-height:1.7;
}
button{font-family:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--copper); outline-offset:3px}

#app{
  max-width:520px; margin:0 auto;
  padding-block:18px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.brand{text-align:center; font:700 1.15rem/1.4 var(--f-display); color:var(--copper); margin:0 0 14px}

.screen{display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center}
.screen > *{min-width:0}

/* Plate */
.plate{
  width:min(42vw,170px); aspect-ratio:1; flex:none; border-radius:50%;
  background:var(--plate); display:grid; place-items:center;
  box-shadow:0 0 0 7px var(--ring), var(--shadow);
}
.plate-emoji{font-size:4.6rem; line-height:1}
.plate-photo{padding:8px}
.plate-photo img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block}
#home .plate{width:min(56vw,220px); margin-block:4px 2px}

h1{margin:0; font:700 2.6rem/1.35 var(--f-display); color:var(--ink)}
h2{margin:0; font:700 1.6rem/1.6 var(--f-display); color:var(--ink); text-wrap:balance}
.lead{margin:0; color:var(--ink2); max-width:22em; text-wrap:balance}
.best{margin:0; font-weight:700; color:var(--copper)}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:56px; padding:0 26px; border-radius:999px; border:2px solid transparent;
  font:800 1.05rem/1.2 var(--f-body); text-decoration:none; cursor:pointer; text-align:center;
}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--green); color:var(--on-green)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.site{background:var(--copper); color:var(--on-copper); width:100%; min-height:62px; font-size:1.12rem; box-shadow:0 10px 20px -12px var(--copper)}
.btn.fridge-cta{background:var(--honey); color:var(--on-honey); width:100%}
@media (hover:hover){ .btn.ghost:hover{border-color:var(--green)} }

/* Home modes */
.modes{display:grid; gap:12px; width:100%}
.mode{
  display:flex; flex-direction:column; align-items:center; gap:2px; min-height:88px; padding:14px 18px;
  border-radius:24px; border:0; cursor:pointer; text-align:center; width:100%;
  background:var(--green); color:var(--on-green);
}
.mode:active{transform:translateY(2px)}
.mode.fridge{background:var(--honey); color:var(--on-honey)}
.mode-t{font:800 1.3rem/1.4 var(--f-body)}
.mode-d{font-weight:500; font-size:.92rem; opacity:.92}

/* Play */
.topline{width:100%; display:flex; align-items:center; gap:10px}
.quit{
  width:40px; height:40px; flex:none; border-radius:50%; border:2px solid var(--line);
  background:transparent; color:var(--ink2); font-size:1rem; cursor:pointer; line-height:1;
}
.dots{display:flex; gap:6px; list-style:none; margin:0; padding:0; flex:1; justify-content:center}
.dot{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--line);
  display:grid; place-items:center; font-size:13px; font-weight:800; line-height:1; color:#fff;
}
.dot.cur{border-color:var(--green); background:var(--plate)}
.dot.ok{background:var(--good); border-color:var(--good)}
.dot.ok::after{content:'✓'}
.dot.part{background:var(--honey); border-color:var(--honey); color:var(--on-honey)}
.dot.part::after{content:'½'}
.dot.no{background:var(--bad); border-color:var(--bad)}
.dot.no::after{content:'✗'}
.dot.ok,.dot.no,.dot.part{animation:pop .35s ease-out}
:root[data-theme="dark"] .dot.ok,:root[data-theme="dark"] .dot.no{color:#10160F}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .dot.ok,:root:not([data-theme="light"]) .dot.no{color:#10160F} }
.dish-name{margin:0; font:700 1.5rem/1.5 var(--f-display); color:var(--copper)}
.replay{
  min-height:44px; padding:0 20px; border-radius:999px; border:2px solid var(--line); background:transparent;
  color:var(--ink); font:800 .98rem/1 var(--f-body); cursor:pointer;
}
.pts{
  flex:none; min-width:76px; text-align:center; background:var(--plate); border-radius:999px; padding:4px 12px;
  font-weight:800; font-size:.95rem; color:var(--copper); box-shadow:0 0 0 2px var(--line) inset;
}

#stage{width:100%; display:flex; flex-direction:column; gap:14px}
.pills{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; width:100%}
.pill{
  display:flex; align-items:center; gap:10px; background:var(--pill); border-radius:999px;
  padding:9px 16px; font-weight:700; font-size:.98rem; line-height:1.4; box-shadow:0 6px 14px -10px rgba(58,42,29,.5); text-align:start;
}
.pill-e{font-size:1.35rem; line-height:1; flex:none}

.fridge{width:100%; border:3px solid var(--line); border-radius:26px; background:var(--plate); padding:6px 14px 4px}
.fridge-h{margin:6px 0 0; font-weight:800; color:var(--ink2); font-size:.9rem}
.shelf{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px 0; border-bottom:4px solid var(--line)}
.shelf:last-child{border-bottom:0}
.fchip{display:inline-flex; align-items:center; gap:6px; background:var(--pill); border-radius:999px; padding:6px 13px; font-weight:700; font-size:.95rem; box-shadow:0 0 0 2px var(--line) inset}
.fchip b{font-size:1.2rem; line-height:1; font-weight:400}

.hint{margin:0; color:var(--ink2); font-size:.95rem; font-weight:700}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; width:100%}
.opt{
  display:flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:10px 14px;
  background:var(--pill); color:var(--ink); border:2px solid var(--line); border-radius:20px;
  font:700 1.05rem/1.5 var(--f-body); cursor:pointer; text-align:center;
}
.opt:active:not(:disabled){transform:translateY(2px)}
@media (hover:hover){ .opt:not(:disabled):hover{border-color:var(--green)} }
.opt:disabled{cursor:default}
.opt:disabled:not(.good):not(.bad){opacity:.82}
.opt.good{background:var(--good-bg); border-color:var(--good)}
.opt.good::before{content:'✓'; color:var(--good); font-weight:800}
.opt.bad{background:var(--bad-bg); border-color:var(--bad); animation:shake .4s}
.opt.bad::before{content:'✗'; color:var(--bad); font-weight:800}
.opt-e{font-size:1.4rem; line-height:1}
.opt-body{display:flex; flex-direction:column; gap:0}
.opt-sub{font-size:.82rem; font-weight:500; color:var(--ink2); line-height:1.4}

.steps{display:grid; gap:10px; width:100%}
.step{
  display:flex; align-items:center; gap:12px; text-align:start; width:100%;
  background:var(--pill); color:var(--ink); border:2px solid var(--line); border-radius:18px;
  padding:12px 14px; font:700 1rem/1.6 var(--f-body); cursor:pointer;
}
.step-n{
  width:34px; height:34px; flex:none; border-radius:50%; border:2px dashed var(--line);
  display:grid; place-items:center; font-weight:800; color:var(--on-green); background:transparent;
}
.step.placed{border-color:var(--green); cursor:default}
.step.placed .step-n{background:var(--green); border:2px solid var(--green)}
.step.shake{animation:shake .4s; border-color:var(--bad)}

.fb{width:100%; border-radius:22px; padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb-head{display:flex; align-items:center; gap:10px; font:700 1.35rem/1.4 var(--f-display)}
.fb-ic{
  width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
  font:800 1rem/1 var(--f-body); color:#fff;
}
.fb.good .fb-ic{background:var(--good)}
.fb.bad .fb-ic{background:var(--bad)}
:root[data-theme="dark"] .fb-ic{color:#10160F}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .fb-ic{color:#10160F} }
.fb p{margin:0; font-weight:500}
.fb-pts{
  background:var(--plate); border-radius:999px; padding:6px 22px; font-weight:800; font-size:1.15rem; color:var(--copper);
  box-shadow:0 0 0 2px var(--line) inset;
}
.fb-pts bdi{font-size:1.5rem; direction:ltr; unicode-bidi:isolate}
.fb-actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%}
.fb-actions .primary{flex:1 1 100%}

/* Result */
.score-plate{width:min(56vw,220px); flex-direction:column; align-content:center}
.score-n{font:700 4.8rem/1 var(--f-display); color:var(--copper)}
.score-of{font-weight:700; color:var(--ink2); font-size:.95rem}
.trophy{display:block; line-height:0}
.trophy svg{width:84px; height:84px}
.score-plate.gold{box-shadow:0 0 0 8px rgba(226,165,58,.5), 0 0 44px rgba(226,165,58,.6), var(--shadow)}
.score-plate.gold .score-n{font-size:4rem}
.challenge{margin:0; padding:10px 20px; border-radius:18px; background:var(--plate); color:var(--copper); font-weight:800; box-shadow:0 0 0 2px var(--line) inset}
.confetti{position:fixed; top:-16px; width:9px; height:14px; border-radius:2px; pointer-events:none; z-index:60; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(560deg)}}
.result-actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%}
.result-actions .primary{flex:1 1 100%}
.recap-title{margin:14px 0 0; font:700 1.25rem/1.5 var(--f-display); color:var(--copper)}
.recap{list-style:none; margin:0; padding:0; width:100%}
.recap li{display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line); text-align:start}
.recap .r-e{font-size:1.5rem; line-height:1; width:2rem; text-align:center}
.recap .r-n{flex:1; font-weight:700; min-width:0}
.recap .r-p{font-weight:800; direction:ltr; unicode-bidi:isolate}
.recap .r-p.y{color:var(--good)}
.recap .r-p.n{color:var(--bad)}
.recap a,.recap button{
  background:none; border:0; padding:4px 2px; color:var(--copper); font:700 .95rem/1.4 var(--f-body);
  text-decoration:underline; text-underline-offset:4px; cursor:pointer;
}

.flag{display:flex; justify-content:center; gap:4px; margin-top:34px}
.flag i{width:38px; height:4px; border-radius:2px}
.flag i:nth-child(1){background:var(--fl-r)}
.flag i:nth-child(2){background:var(--fl-k)}
.flag i:nth-child(3){background:var(--fl-g)}

/* Video */
.modal{
  position:fixed; inset:0; z-index:50; background:rgba(20,14,8,.8); display:grid; place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.vbox{width:min(100%,340px); display:flex; flex-direction:column; gap:12px}
.vbox video{width:100%; max-height:76dvh; aspect-ratio:9/16; object-fit:contain; background:#000; border-radius:16px}
.vbox .btn{color:#fff; background:rgba(0,0,0,.55); border-color:rgba(255,255,255,.45)}

@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
@media (max-width:380px){ h1{font-size:2.2rem} .pills{grid-template-columns:1fr} .dot{width:20px; height:20px; font-size:11px} .dots{gap:5px} .pts{min-width:64px; padding-inline:8px} }
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="brand">المطبخ الليبي البيتي</header>

  <main>
    <section id="home" class="screen">
      <div class="plate plate-photo"><img src="maqroud.jpg" alt="مقروض ليبي معسل"></div>
      <h1>تحدّي المطبخ الليبي</h1>
      <p class="lead" id="lead"></p>
      <div class="modes">
        <button class="mode" id="startMix" type="button">
          <span class="mode-t">تحدّي الأطباق</span>
          <span class="mode-d">خمّن الطبق، والمكوّن الدخيل، وترتيب الخطوات</span>
        </button>
        <button class="mode fridge" id="startFridge" type="button">
          <span class="mode-t">🧊 شن عندك في الثلاجة؟</span>
          <span class="mode-d">اختر الطبق الذي تكفيه مكوّنات ثلاجتك</span>
        </button>
      </div>
      <p class="best" id="best" hidden></p>
      <a class="btn site" id="siteLink" href="#" target="_blank" rel="noopener">تصفّح الوصفات الكاملة في الموقع ↗</a>
    </section>

    <section id="play" class="screen" hidden>
      <div class="topline">
        <button class="quit" id="quit" type="button" aria-label="الصفحة الرئيسية">🏠</button>
        <ol class="dots" id="dots" aria-label="تقدّم الأسئلة"></ol>
        <span class="pts" id="pts"></span>
        <button class="quit" id="snd" type="button" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
      </div>
      <h2 id="qTitle"></h2>
      <button class="replay" id="replay" type="button" hidden>▶ استمع إلى السؤال</button>
      <div class="plate" id="plate" hidden></div>
      <p class="dish-name" id="dishName" hidden></p>
      <div id="stage"></div>
      <div class="fb" id="fb" hidden></div>
    </section>

    <section id="result" class="screen" hidden>
      <div class="plate score-plate" id="rPlate">
        <span class="trophy" id="trophy" hidden><svg viewBox="0 0 100 100" aria-hidden="true">
          <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7D27A"/><stop offset=".55" stop-color="#E2A53A"/><stop offset="1" stop-color="#B9791A"/></linearGradient></defs>
          <path d="M28 14h44v26c0 16-9 27-22 27S28 56 28 40z" fill="url(#gold)"/>
          <path d="M28 22H14c0 16 6 26 18 29M72 22h14c0 16-6 26-18 29" fill="none" stroke="#D99A1E" stroke-width="6" stroke-linecap="round"/>
          <rect x="45" y="66" width="10" height="14" fill="url(#gold)"/>
          <path d="M30 80h40v8H30z" fill="url(#gold)"/>
          <path d="M38 20c-1 12 2 22 8 28" stroke="#FFF3CC" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
        </svg></span>
        <span class="score-n" id="rScore"></span><span class="score-of" id="rOf"></span></div>
      <h1 id="rTitle" style="font-size:2.1rem"></h1>
      <p class="lead" id="rDesc"></p>
      <p class="challenge" id="rChallenge" hidden>هناك من حصل على 100%، حاول مجددًا</p>
      <p class="best" id="rBest"></p>
      <div class="result-actions">
        <a class="btn primary" id="rShare" href="#" target="_blank" rel="noopener">مشاركة النتيجة على واتساب</a>
        <a class="btn fridge-cta" id="rFridge" href="#" target="_blank" rel="noopener" hidden>جرّب أداة الثلاجة الحقيقية في الموقع ↗</a>
        <a class="btn site" id="rSite" href="#" target="_blank" rel="noopener">تصفّح الوصفات الكاملة في الموقع ↗</a>
        <button class="btn ghost" id="rAgain" type="button">جولة جديدة</button>
        <button class="btn ghost" id="rHome" type="button">🏠 الصفحة الرئيسية</button>
        <button class="btn ghost" id="rCopy" type="button">نسخ الرسالة</button>
      </div>
      <h3 class="recap-title">أطباق هذه الجولة</h3>
      <ul class="recap" id="recap"></ul>
    </section>
  </main>

  <footer class="flag" aria-hidden="true"><i></i><i></i><i></i></footer>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="فيديو الوصفة">
    <div class="vbox">
      <video id="vid" controls playsinline preload="none"></video>
      <button class="btn ghost" id="vclose" type="button">إغلاق</button>
    </div>
  </div>
</div>

<script src="recipes.js"></script>
<script>
(function(){
  'use strict';
  var D = window.GAME_DATA || {};
  var CFG = D.config || {}, ING = D.ingredients || {}, REC = D.recipes || [];
  var NQ = CFG.questions || 5;
  var PTS = CFG.points || 20;
  var MAXPTS = NQ * PTS;
  var STAPLE = ['salt', 'water', 'oil', 'oil_butter', 'bzar', 'cinnamon', 'red_pepper', 'baking_powder', 'vanilla'];
  var lastPraise = -1;
  var PRAISE = ['ما شاء الله عليك، الله يبارك!', 'فالحة يا كبدي فالحة!', 'اختياراتك بنّة وصنّة!'];
  var S = null;
  var AUD = D.audio || {};
  var SOUND = true;
  try{ SOUND = localStorage.getItem('lkc-snd') !== '0'; }catch(e){}

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function shuffle(a){ var b = a.slice(); for(var i = b.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
  function sample(a, n){ return shuffle(a).slice(0, n); }
  function pickOne(a){ return a[Math.floor(Math.random() * a.length)]; }
  function isSweet(r){ return r.section === 'حلويات'; }
  function mainOf(r){ return (r.main && r.main.length) ? r.main : r.ing.filter(function(k){ return STAPLE.indexOf(k) < 0; }).slice(0, 6); }
  function recipeUrl(r){ return r.url || CFG.siteUrl || '#'; }
  function track(n){ try{ if(window.goatcounter && window.goatcounter.count){ window.goatcounter.count({ path: 'game/' + n, title: 'تحدّي المطبخ الليبي ' + n, event: true }); } }catch(e){} }

  function getBest(){ try{ return parseInt(localStorage.getItem('lkc-best-pts') || '0', 10) || 0; }catch(e){ return 0; } }

  var actx = null;
  function ac(){
    if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
    return actx;
  }
  function tone(freq, t0, dur, type, vol, slideTo){
    var c = ac(); if(!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function applause(t0, dur){
    var c = ac(); if(!c) return;
    var len = Math.floor(c.sampleRate * 0.08), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    var n = Math.floor(dur * 34);
    for(var k = 0; k < n; k++){
      var at = c.currentTime + t0 + Math.random() * dur;
      var env = Math.min(1, Math.min((at - c.currentTime - t0) / 0.4, (dur - (at - c.currentTime - t0)) / 0.9 + 0.2));
      var src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1400 + Math.random() * 2600; f.Q.value = 0.7;
      g.gain.value = 0.35 * Math.max(0.1, env) * (0.5 + Math.random() * 0.5);
      src.connect(f); f.connect(g); g.connect(c.destination); src.start(at);
    }
  }

  var SFX = {
    correct: function(){ [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(f, i * 0.09, 0.3, 'triangle', 0.22); tone(f * 2, i * 0.09, 0.2, 'sine', 0.06); }); },
    partial: function(){ tone(587.33, 0, 0.18, 'triangle', 0.2); tone(698.46, 0.12, 0.3, 'triangle', 0.2); },

    nope:    function(){ tone(196, 0, 0.14, 'square', 0.06, 160); },
    win:     function(){ [523.25, 659.25, 783.99, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f, i){ tone(f, i * 0.11, 0.3, 'triangle', 0.2); }); },

  function playFile(f){ try{ var a = new Audio((AUD.dir || '') + f); var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} }

  var voice = null, vCache = {}, vTimer = null;
  function vAudio(f){
    if(!vCache[f]){ var a = new Audio(); a.preload = 'auto'; a.src = (AUD.dir || '') + f; vCache[f] = a; }
    return vCache[f];
  }
  function preloadVoices(){

    Object.keys(AUD.files || {}).forEach(function(k){ if(AUD.files[k]) all.push(AUD.files[k]); });
    (AUD.praise || []).forEach(function(f){ if(f) all.push(f); });

  function fileFor(key){

    if(key === 'praise'){ var list = AUD.praise || []; if(!list.filter(Boolean).length) return ''; var pi = (lastPraise >= 0 && list[lastPraise]) ? lastPraise : Math.floor(Math.random() * list.length); return list[pi] || list.filter(Boolean)[0]; }

  function stopVoice(){

  }
  function playVoice(keys){
    stopVoice();
    if(!SOUND) return;
    var files = keys.map(fileFor).filter(Boolean), i = 0;
    if(!files.length) return;
    (function next(){
      if(i >= files.length) return;

  function questionKeys(q){
    if(q.type === 'guess') return ['q_guess', 'hint_guess'];
    if(q.type === 'fridge') return ['q_fridge', 'hint_fridge'];

  function renderSnd(){ $('snd').textContent = SOUND ? '🔊' : '🔇'; }

  /* ---------- Questions ---------- */
  function makeGuess(r){
    var others = REC.filter(function(o){ return o.id !== r.id; });
    if(others.length < 3 || r.ing.length < 3) return null;
    for(var tries = 0; tries < 14; tries++){
      var same = shuffle(others.filter(function(o){ return o.section === r.section; }));
      var diff = shuffle(others.filter(function(o){ return o.section !== r.section; }));
      var dist = same.slice(0, 2).concat(diff.slice(0, 1));
      if(dist.length < 3) dist = shuffle(others).slice(0, 3);
      var used = {};
      dist.forEach(function(o){ o.ing.forEach(function(k){ used[k] = 1; }); });
      var uniq = r.ing.filter(function(k){ return !used[k]; });
      if(!uniq.length) continue;
      var first = sample(uniq, 2);
      var rest = r.ing.filter(function(k){ return first.indexOf(k) < 0; });
      var shown = shuffle(first.concat(sample(rest, 4 - first.length)));
      return { type: 'guess', r: r, shown: shown, options: shuffle([r].concat(dist)), title: 'أي صنف يبي هادي المكونات؟' };
    }
    return null;
  }
  function makeIntruder(r){
    var flag = isSweet(r) ? 's' : 'v';
    var pool = Object.keys(ING).filter(function(k){ return ING[k].x === flag && r.ing.indexOf(k) < 0; });
    if(!pool.length || r.ing.length < 3) return null;
    var foreign = pickOne(pool);
    return { type: 'intruder', r: r, foreign: foreign, options: shuffle(sample(r.ing, 3).concat([foreign])), title: 'أي من هذه المكونات مليهاش علاقة بالوصفة؟' };
  }
  function makeOrder(r){
    if(!r.steps || r.steps.length < 3) return null;
    var items = r.steps.map(function(d, i){ return { i: i, d: d }; });
    var sh = shuffle(items);
    for(var t = 0; t < 6 && sh.every(function(s, idx){ return s.i === idx; }); t++) sh = shuffle(items);
    return { type: 'order', r: r, items: items, shuffled: sh, title: 'هيا يا فالحة، رتّبي الخطوات صح' };
  }
  function makeFridge(r){
    var fridge = mainOf(r);
    if(fridge.length < 3) return null;
    var cand = REC.filter(function(o){ return o.id !== r.id; }).map(function(o){
      return { r: o, miss: mainOf(o).filter(function(k){ return fridge.indexOf(k) < 0; }) };
    }).filter(function(x){ return x.miss.length >= 1; });
    if(cand.length < 3) return null;
    var sorted = shuffle(cand).sort(function(a, b){ return a.miss.length - b.miss.length; });
    var pick = sorted.slice(0, 2).concat(sample(sorted.slice(2), 1));
    if(pick.length < 3) pick = sorted.slice(0, 3);
    var options = shuffle([{ r: r, miss: [] }].concat(pick));
    return { type: 'fridge', r: r, fridge: shuffle(fridge), options: options, title: 'شن عندك في التلاجه؟' };
  }
  var MAKERS = { guess: makeGuess, intruder: makeIntruder, order: makeOrder, fridge: makeFridge };

  function buildRound(mode){
    var recs = shuffle(REC);
    var types = mode === 'fridge'
      ? ['fridge', 'fridge', 'fridge', 'fridge', 'fridge']
      : shuffle(['guess', 'intruder', 'order', pickOne(['guess', 'intruder', 'order']), pickOne(['guess', 'intruder', 'order'])]);
    var qs = [];
    for(var i = 0; i < NQ; i++){
      var r = recs[i % recs.length];
      var order = [types[i % types.length], 'guess', 'intruder', 'order'];
      for(var k = 0; k < order.length; k++){
        var q = MAKERS[order[k]](r);
        if(q){ qs.push(q); break; }
      }
    }
    return qs;
  }

      var li = el('li');
      li.appendChild(el('span', 'r-e', x.r.emoji || '🍽️'));
      li.appendChild(el('span', 'r-n', x.r.name));
      li.appendChild(el('span', 'r-p ' + (x.pts > 0 ? 'y' : 'n'), '+' + x.pts));
      if(x.r.video){
        var v = el('button', null, 'فيديو'); v.type = 'button';
        v.addEventListener('click', function(){ openVideo(x.r); });
        li.appendChild(v);
      }
      var a = el('a', null, 'الوصفة'); a.href = recipeUrl(x.r); a.target = '_blank'; a.rel = 'noopener';
      li.appendChild(a);
      ul.appendChild(li);
    });
    sfx(perfect ? 'trophy' : (n / MAXPTS >= 0.8 ? 'win' : 'soft'));
    if(perfect){ confetti(); lastPraise = Math.floor(Math.random() * 3); vTimer = setTimeout(function(){ playVoice(['praise']); }, 1300); }
    else setTimeout(function(){ playVoice(['res_retry']); }, 900);
    showScreen('result');
    track('finish-' + S.mode + '-' + n);
  }

  function copyText(text, btn){
    function done(){ btn.textContent = 'تم النسخ'; setTimeout(function(){ btn.textContent = 'نسخ الرسالة'; }, 1800); }
    function fallback(){
      var ta = el('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ if(document.execCommand('copy')) done(); }catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); }
    else fallback();
  }

  /* ---------- Video ---------- */
  function openVideo(r){
    stopVoice();
    var v = $('vid'); v.poster = r.img || ''; v.src = r.video;
    $('modal').hidden = false;
    var p = v.play(); if(p && p.catch) p.catch(function(){});
    track('video-' + r.id);
    $('vclose').focus();
  }
  function closeVideo(){
    var v = $('vid'); v.pause(); v.removeAttribute('src'); v.load();
    $('modal').hidden = true;
  }
  $('vclose').addEventListener('click', closeVideo);
  $('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeVideo(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !$('modal').hidden) closeVideo(); });

  /* ---------- Wiring ---------- */
  $('startMix').addEventListener('click', function(){ startGame('mix'); });
  $('startFridge').addEventListener('click', function(){ startGame('fridge'); });
  $('rHome').addEventListener('click', function(){ stopVoice(); renderHome(); showScreen('home'); window.scrollTo(0,0); });
  /* روابط الموقع: داخل التطبيق نفتحها في نفس النافذة (فتح نافذة جديدة لا يعمل في التطبيق) */
  var STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || (document.referrer||'').indexOf('android-app://') === 0;
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[target="_blank"]');
    if(!a || !STANDALONE) return;
    var u = a.getAttribute('href'); if(!u || u === '#') return;
    e.preventDefault(); window.location.href = a.href;
  });
  $('quit').addEventListener('click', function(){ stopVoice(); renderHome(); showScreen('home'); });
  $('snd').addEventListener('click', function(){
    SOUND = !SOUND;
    try{ localStorage.setItem('lkc-snd', SOUND ? '1' : '0'); }catch(e){}
    if(!SOUND) stopVoice(); else sfx('tick');
    renderSnd();
  });
  renderSnd();
  renderHome();
})();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
